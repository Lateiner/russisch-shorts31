<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch-Übung: Kontext-Szenarien</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.6rem;
            color: var(--primary-color);
        }

        .progress {
            text-align: center;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        /* Szenario Box */
        .scenario-card {
            background-color: #f8fafc;
            border-left: 5px solid var(--primary-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Antwort-Optionen */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background-color: #f0f7ff;
            transform: translateY(-1px);
        }

        /* Feedback-Styles */
        .option-btn.correct {
            background-color: #ecfdf5;
            border-color: var(--success-color);
            color: #065f46;
        }

        .option-btn.incorrect {
            background-color: #fef2f2;
            border-color: var(--error-color);
            color: #991b1b;
        }

        .explanation-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: #1e40af;
            display: none;
        }

        /* Steuerung */
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            color: white;
        }

        .btn-next {
            background: var(--primary-color);
            margin-left: auto;
        }
        .btn-next:hover { background: #357abd; }
        
        .btn-reset { background: #94a3b8; }
        .btn-reset:hover { background: #64748b; }

        /* Responsive Anpassungen */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px 15px; }
            h1 { font-size: 1.4rem; }
            .scenario-card { font-size: 1rem; padding: 15px; }
            .option-btn { font-size: 1rem; padding: 12px 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Kontext-Szenarien (Ситуации)</h1>
    <div class="progress" id="progress-text">Szenario 1 von 3</div>

    <div class="scenario-card" id="scenario-text">
        <!-- Wird per JS befüllt -->
    </div>

    <div class="options-list" id="options-container">
        <!-- Wird per JS befüllt -->
    </div>

    <div class="explanation-box" id="explanation-container">
        <!-- Wird per JS befüllt -->
    </div>

    <div class="controls">
        <button class="btn btn-reset" onclick="restartQuiz()">Neustart</button>
        <button class="btn btn-next" id="next-btn" onclick="nextScenario()" style="display: none;">Weiter</button>
    </div>
</div>

<script>
    const quizData = [
        {
            scenario: "Anna hat ihren Pullover so eilig angezogen, dass man jetzt alle Innennähte und das Waschetikett auf der Außenseite sieht. Welches Wort beschreibt diese Situation ganz exakt?",
            options: ["наоборот", "наизнанку", "прямо", "правильно"],
            correctIndex: 1,
            explanation: "Richtig! „наизнанку“ bedeutet ganz konkret „auf links“ – also mit der Innenseite und den Nähten nach außen."
        },
        {
            scenario: "Maxim hat sein T-Shirt im Dunkeln angezogen. Das Etikett kratzt ihn nun am Hals, weil die Vorderseite des Shirts auf seinem Rücken liegt. Welcher Begriff passt hier am besten?",
            options: ["налево", "наизнанку", "прямо", "шиворот-навыворот"],
            correctIndex: 3,
            explanation: "Richtig! „шиворот-навыворот“ bedeutet allgemein „verkehrt herum“ und wird verwendet, wenn Kleidung zum Beispiel von hinten nach vorne getragen wird."
        },
        {
            scenario: "Du möchtest einem Freund erklären, dass die Ausdrücke „наизнанку“ und „шиворот-навыворот“ im Bezug auf Kleidung eine sehr ähnliche Bedeutung haben. Was sind diese beiden Wörter füreinander?",
            options: ["синонимы", "антонимы", "глаголы"],
            correctIndex: 0,
            explanation: "Richtig! Laut Anleitung werden diese beiden Wörter im Kontext von Kleidung als Synonyme („синонимы“) verwendet."
        }
    ];

    let currentIndex = 0;
    let hasAnswered = false;

    const scenarioText = document.getElementById('scenario-text');
    const optionsContainer = document.getElementById('options-container');
    const explanationContainer = document.getElementById('explanation-container');
    const progressText = document.getElementById('progress-text');
    const nextBtn = document.getElementById('next-btn');

    function loadScenario() {
        if (currentIndex >= quizData.length) {
            showFinalResults();
            return;
        }

        hasAnswered = false;
        nextBtn.style.display = 'none';
        explanationContainer.style.display = 'none';
        progressText.textContent = `Szenario ${currentIndex + 1} von ${quizData.length}`;
        
        const currentData = quizData[currentIndex];
        scenarioText.textContent = currentData.scenario;
        
        optionsContainer.innerHTML = "";
        currentData.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.className = "option-btn";
            button.textContent = option;
            button.onclick = () => handleOptionClick(index);
            optionsContainer.appendChild(button);
        });
    }

    function handleOptionClick(selectedIndex) {
        if (hasAnswered) return; // Verhindert mehrfaches Klicken
        hasAnswered = true;

        const currentData = quizData[currentIndex];
        const buttons = optionsContainer.querySelectorAll('.option-btn');

        // Alle Knöpfe deaktivieren
        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === currentData.correctIndex) {
            buttons[selectedIndex].classList.add('correct');
        } else {
            buttons[selectedIndex].classList.add('incorrect');
            buttons[currentData.correctIndex].classList.add('correct'); // Richtige Antwort hervorheben
        }

        // Erklärung einblenden
        explanationContainer.textContent = currentData.explanation;
        explanationContainer.style.display = 'block';
        
        // Weiter-Button einblenden
        nextBtn.style.display = 'block';
    }

    function nextScenario() {
        currentIndex++;
        loadScenario();
    }

    function showFinalResults() {
        progressText.textContent = "Geschafft!";
        scenarioText.textContent = "Hervorragend! Du hast alle Szenarien gemeistert und den Unterschied zwischen „наизнанку“ und „шиворот-навыворот“ verstanden.";
        optionsContainer.innerHTML = "";
        explanationContainer.style.display = 'none';
        nextBtn.style.display = 'none';
    }

    function restartQuiz() {
        currentIndex = 0;
        loadScenario();
    }

    // Erster Start beim Laden der Seite
    loadScenario();
</script>

</body>
</html>
